name: E2E

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every run shares the test account's rate limit, so only one run goes at a
# time. A newer pending run replaces an older pending one.
concurrency:
  group: e2e-test-account
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      # The jobs share the test account's rate limit, so running them one at a
      # time keeps TestRateLimit's bursts from colliding.
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Secrets aren't passed to pull requests from forks, so the tests skip
      # themselves when the key is empty.
      EMAILABLE_TEST_API_KEY: ${{ secrets.EMAILABLE_TEST_API_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -tags e2e -count=1 -v ./e2e
